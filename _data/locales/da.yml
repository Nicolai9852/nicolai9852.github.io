# The layout text of site

# ----- Commons label -----

layout:
  post: Opslag
  category: Kategori
  tag: Tag

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: Hjem
  categories: Kategorier
  tags: Tags
  archives: Arkiv
  about: About

# the text displayed in the search bar & search results
search:
  hint: søg
  cancel: Afbryd
  no_results: Ups! Ingen resultater fundet.

panel:
  lastmod: Senest opdateret
  trending_tags: Trending Tags
  toc: Indhold

copyright:
  # Shown at the bottom of the post
  license:
    template: Dette opslag er licenseret under :LICENSE_NAME af forfatteren.
    name: CC BY 4.0
    link: https://creativecommons.org/licenses/by/4.0/

  # Displayed in the footer
  brief: Nogle rettigheder reserveret.
  verbose: >-
    Except where otherwise noted, the blog posts on this site are licensed
    under the Creative Commons Attribution 4.0 International (CC BY 4.0) License by the author.

# meta: Using the :THEME theme for :PLATFORM.

not_found:
  statement: Sorry, we've misplaced that URL or it's pointing to something that doesn't exist.

notification:
  update_found: En ny version af indholdet er fundet!
  update: Opdater

# ----- Posts related labels -----

post:
  written_by: Af
  posted: Udgivet
  updated: Opdateret
  words: ord
  pageview_measure: visninger
  read_time:
    unit: min
    prompt: læsning
  relate_posts: Læs mere
  share: Del
  button:
    next: Nyere
    previous: Ældre
    copy_code:
      succeed: Kopieret!
    share_link:
      title: Kopier link
      succeed: Link kopieret!

# Date time format.
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%F"
    dayjs: "ll"
  archives:
    strftime: "%b"
    dayjs: "MMM"

# categories page
categories:
  category_measure:
    singular: kategori
    plural: kategorier
  post_measure:
    singular: opslag
    plural: opslag
