<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting...</title>
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="0; url=/">
  <script>
    (function () {
      var target = window.location.origin + "/";
      if (window.location.href !== target) {
        window.location.replace(target);
      }
    })();
  </script>
  <style>
    :root {
      --bg: #f5f7fb;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0f766e;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      text-align: center;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }

    a {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <p>This page does not exist. Redirecting you now...</p>
    <p>
      If you are not redirected, go to
      <a href="/">the main page</a>.
    </p>
  </main>
</body>
</html>
