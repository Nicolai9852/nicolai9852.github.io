<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Moved</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0f766e;
      --accent-hover: #115e59;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #dbeafe, var(--bg) 60%);
    }

    main {
      width: min(680px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(1.8rem, 3vw, 2.2rem);
      line-height: 1.2;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
    }

    .button-link {
      display: inline-block;
      margin-top: 1rem;
      text-decoration: none;
      color: #ffffff;
      background: var(--accent);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-weight: 600;
    }

    .button-link:hover,
    .button-link:focus-visible {
      background: var(--accent-hover);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <h1>TeoTechTips er blevet flyttet</h1>
    <p>
      TeoTechTips er blevet omdøbt til ITeologi Studie og har fået et nyt design, som minder om
      <a href="https://iteologi.dk" rel="noopener noreferrer">ITeologi.dk</a>.
      Alle tidligere indlæg og indhold er blevet migreret til det nye site, så du kan stadig finde dine yndlingsartikler og tips der.
    </p>
    <a class="button-link" href="https://studie.iteologi.dk" rel="noopener noreferrer">Go til ITeologi Studie</a>
  </main>
</body>
</html>
